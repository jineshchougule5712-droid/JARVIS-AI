services:
  - type: web
    name: jarvis-ai
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DB_URL
        fromDatabase:
          name: jarvis-db
          property: connectionString
      - key: DB_USER
        fromDatabase:
          name: jarvis-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: jarvis-db
          property: password
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gpt-4o-mini

databases:
  - name: jarvis-db
    plan: free
    databaseName: jarvis
    user: jarvis
